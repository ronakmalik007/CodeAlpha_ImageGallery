<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wander — A Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>Wander</h1>
  <p>a small collection of places worth stopping for</p>
</header>

<nav class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="nature">Nature</button>
  <button class="filter-btn" data-filter="city">City</button>
  <button class="filter-btn" data-filter="people">People</button>
  <button class="filter-btn" data-filter="food">Food</button>
</nav>

<main class="gallery" id="gallery">

  <figure class="photo" data-category="nature">
    <img src="https://picsum.photos/seed/pine1/500/650" alt="Pine forest at dawn">
    <figcaption>Pine forest, early light</figcaption>
  </figure>

  <figure class="photo" data-category="city">
    <img src="https://picsum.photos/seed/street2/500/400" alt="Narrow city street">
    <figcaption>Back alley, Lisbon</figcaption>
  </figure>

  <figure class="photo" data-category="food">
    <img src="https://picsum.photos/seed/bread3/500/500" alt="Fresh bread on a table">
    <figcaption>Sunday bread</figcaption>
  </figure>

  <figure class="photo" data-category="people">
    <img src="https://picsum.photos/seed/market4/500/700" alt="Person at a market stall">
    <figcaption>Market seller, midday</figcaption>
  </figure>

  <figure class="photo" data-category="nature">
    <img src="https://picsum.photos/seed/lake5/500/380" alt="Still lake with mountains">
    <figcaption>Still water</figcaption>
  </figure>

  <figure class="photo" data-category="city">
    <img src="https://picsum.photos/seed/rooftop6/500/620" alt="Rooftops at sunset">
    <figcaption>Rooftops, golden hour</figcaption>
  </figure>

  <figure class="photo" data-category="people">
    <img src="https://picsum.photos/seed/kids7/500/450" alt="Children playing">
    <figcaption>After school</figcaption>
  </figure>

  <figure class="photo" data-category="food">
    <img src="https://picsum.photos/seed/coffee8/500/600" alt="Cup of coffee on wood table">
    <figcaption>Slow morning</figcaption>
  </figure>

  <figure class="photo" data-category="nature">
    <img src="https://picsum.photos/seed/desert9/500/500" alt="Desert dunes">
    <figcaption>Dunes, no wind</figcaption>
  </figure>

  <figure class="photo" data-category="city">
    <img src="https://picsum.photos/seed/subway10/500/400" alt="Empty subway platform">
    <figcaption>Last train</figcaption>
  </figure>

  <figure class="photo" data-category="people">
    <img src="https://picsum.photos/seed/musician11/500/660" alt="Street musician">
    <figcaption>Corner of 5th</figcaption>
  </figure>

  <figure class="photo" data-category="food">
    <img src="https://picsum.photos/seed/soup12/500/420" alt="Bowl of soup">
    <figcaption>Winter soup</figcaption>
  </figure>

</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-prev" id="lbPrev">&#10094;</button>
  <img id="lbImage" src="" alt="">
  <p id="lbCaption"></p>
  <button class="lb-next" id="lbNext">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
